<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Pokform Bilingual Log Test</title><style>
body{margin:0;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,sans-serif;padding:24px 18px} .wrap{max-width:760px;margin:auto}button{background:#111;color:#fff;border:1px solid #555;border-radius:12px;padding:14px;font-size:17px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}.active{border-color:#fff;background:#242424}#listen{width:100%;font-size:20px}.panel{border-top:1px solid #333;padding:14px 0}.label{font-size:12px;opacity:.55;text-transform:uppercase;margin-bottom:7px}.value{font-size:17px;white-space:pre-wrap;overflow-wrap:anywhere}#big{font-size:30px;text-align:center;min-height:50px;margin:18px 0}#status{opacity:.75}
</style></head><body><div class="wrap"><div id="status">Not listening</div><div class="row"><button id="en" class="active">English · en-US</button><button id="th">ไทย · th-TH</button></div><div id="big">—</div><button id="listen">Listen</button><div class="panel"><div class="label">Live / Raw</div><div id="raw" class="value">—</div></div><div class="panel"><div class="label">Final</div><div id="final" class="value">—</div></div><div class="panel"><div class="label">Transcript log</div><div id="log" class="value">—</div></div><div class="row"><button id="copy">Copy Transcript</button><button id="clear">Clear Log</button></div></div>
<script>
const SR=window.SpeechRecognition||window.webkitSpeechRecognition,$=x=>document.getElementById(x);let lang="en-US",r=null,listening=false;
function norm(s){if(lang!=="en-US")return s.trim();return s.toLowerCase().replace(/\bspace\b/g,"spades").replace(/\bclap\b/g,"clubs").replace(/\basses\b/g,"aces").replace(/\bass\b/g,"ace").trim()}
function stamp(){return new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit",second:"2-digit"})}
function log(t){let line=stamp()+"  ["+lang+"]  "+t;$("log").textContent=$("log").textContent==="—"?line:$("log").textContent+"\n"+line}
function setLang(x){lang=x;$("en").classList.toggle("active",x==="en-US");$("th").classList.toggle("active",x==="th-TH");if(listening&&r)r.stop()}
function build(){if(!SR){$("status").textContent="Speech recognition unavailable";return}r=new SR();r.lang=lang;r.continuous=true;r.interimResults=true;r.maxAlternatives=1;
r.onstart=()=>{listening=true;$("status").textContent="READY · "+lang;$("listen").textContent="Stop"};
r.onresult=e=>{let live="",fin=[];for(let i=e.resultIndex;i<e.results.length;i++){let t=e.results[i][0].transcript.trim();live+=(live?" ":"")+t;if(e.results[i].isFinal)fin.push(t)}if(live){$("raw").textContent=live;$("big").textContent=norm(live)}if(fin.length){let f=fin.join(" ");$("final").textContent=f;$("big").textContent=norm(f);log(f)}};
r.onerror=e=>$("status").textContent="Error: "+e.error;r.onend=()=>{listening=false;$("status").textContent="Not listening";$("listen").textContent="Listen"}}
$("listen").onclick=()=>{if(listening&&r)r.stop();else{build();try{r.start()}catch(e){$("status").textContent="Start failed"}}};$("en").onclick=()=>setLang("en-US");$("th").onclick=()=>setLang("th-TH");
$("clear").onclick=()=>{$("log").textContent=$("raw").textContent=$("final").textContent=$("big").textContent="—"};
$("copy").onclick=async()=>{let t=$("log").textContent;if(t==="—")return;try{await navigator.clipboard.writeText(t);$("status").textContent="Transcript copied"}catch(e){$("status").textContent="Copy unavailable"}};
</script></body></html>
