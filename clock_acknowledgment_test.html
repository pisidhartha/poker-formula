<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#171b25"><title>Clock acknowledgment test</title><style>*{box-sizing:border-box}body{margin:0;background:#171b25;color:white;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif}#wall{position:fixed;inset:-18px;background:linear-gradient(140deg,#182b49 5%,#667f9b 35%,#b98e83 65%,#242c48);background-position:center;background-size:cover;transition:filter .55s ease;filter:blur(13px)}#wall.clear{filter:blur(0)}#shade{position:fixed;inset:0;background:linear-gradient(#0005,#0000 45%,#0004);pointer-events:none}#clock{position:relative;text-align:center;padding-top:calc(env(safe-area-inset-top) + 62px);text-shadow:0 2px 12px #0005}#date{font-size:20px;font-weight:500}#time{font-size:clamp(76px,21vw,112px);font-weight:600;letter-spacing:-.07em;line-height:1.1;font-variant-numeric:tabular-nums}#minute{display:inline-block;transition:opacity .18s ease}#minute.dim{opacity:.12}#panel{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 22px);left:15px;right:15px;padding:16px;border-radius:18px;background:#111a;border:1px solid #ffffff33;backdrop-filter:blur(18px);font-size:14px}#panel h2{font-size:14px;margin:0 0 10px}button,label{font:inherit}button{background:#fff;color:#111;border:0;border-radius:10px;padding:12px;min-height:43px;font-weight:600}#buttons{display:flex;gap:8px}#buttons button{flex:1}#upload{width:100%;margin:10px 0;color:white}#hint{opacity:.8;font-size:12px;margin-top:10px;line-height:1.5}#hide{position:absolute;right:12px;top:10px;background:transparent;color:white;padding:4px 8px}#reveal{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 12px);right:12px;background:#0007;color:white;font-size:12px;display:none}body.clean #panel{display:none}body.clean #reveal{display:block}</style></head><body><div id="wall"></div><div id="shade"></div><div id="clock"><div id="date"></div><div id="time"><span id="hour">2:</span><span id="minute">29</span></div></div><div id="panel"><button id="hide">Hide ×</button><h2>Peripheral-vision test · no microphone</h2><div id="buttons"><button id="a">A · Dim digits</button><button id="b">B · Clear photo</button></div><input type="file" id="upload" accept="image/*" aria-label="Choose your wallpaper"><div id="hint">Tap A or B, then glance away and test again. Each tap simulates a new result. Choose a wallpaper photo for a realistic test. Hide controls for a clean screen; tap the small Settings button to restore them.</div></div><button id="reveal">Settings</button><script>const wall=document.getElementById('wall'),minute=document.getElementById('minute'),date=document.getElementById('date'),hour=document.getElementById('hour');let key=29,timer;function stamp(){let d=new Date();date.textContent=new Intl.DateTimeFormat('en-US',{weekday:'long',month:'long',day:'numeric'}).format(d);hour.textContent=new Intl.DateTimeFormat('en-US',{hour:'numeric',hour12:true}).format(d).replace(/\D/g,'')+':'}stamp();setInterval(stamp,60000);function next(){key=key===52?1:key+1;minute.textContent=String(key).padStart(2,'0')}function run(which){clearTimeout(timer);wall.classList.remove('clear');minute.classList.remove('dim');next();if(which==='a'){minute.classList.add('dim');timer=setTimeout(()=>minute.classList.remove('dim'),230)}else{wall.classList.add('clear');timer=setTimeout(()=>wall.classList.remove('clear'),1400)}}document.getElementById('a').onclick=()=>run('a');document.getElementById('b').onclick=()=>run('b');document.getElementById('upload').onchange=e=>{let f=e.target.files[0];if(!f)return;let reader=new FileReader();reader.onload=()=>{wall.style.backgroundImage='url('+JSON.stringify(reader.result)+')'};reader.readAsDataURL(f)};document.getElementById('hide').onclick=()=>document.body.classList.add('clean');document.getElementById('reveal').onclick=()=>document.body.classList.remove('clean');</script></body></html>
