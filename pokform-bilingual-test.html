<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pokform Bilingual Speech Test</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: #000; color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    padding: max(18px, env(safe-area-inset-top)) 18px 28px;
  }
  .wrap { max-width: 760px; margin: 0 auto; }
  .top { display:flex; justify-content:space-between; align-items:center; gap:12px; }
  #clock { font-variant-numeric: tabular-nums; font-size: 22px; opacity:.8; }
  #status { font-size:14px; opacity:.75; text-align:right; }
  h1 { font-size: 21px; margin: 28px 0 14px; }
  .lang {
    display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:18px;
  }
  button {
    appearance:none; border:1px solid #555; border-radius:12px;
    background:#111; color:#fff; padding:14px 12px; font-size:17px;
  }
  button.active { border-color:#fff; background:#242424; }
  #listen { width:100%; font-size:20px; margin-bottom:18px; }
  #mode { text-align:center; font-size:14px; letter-spacing:.08em; opacity:.7; margin:12px 0; }
  #big {
    min-height:82px; display:flex; align-items:center; justify-content:center;
    text-align:center; font-size:34px; font-weight:650; padding:12px;
    border:1px solid #333; border-radius:14px; margin-bottom:18px;
    overflow-wrap:anywhere;
  }
  .panel { border-top:1px solid #333; padding:14px 0; }
  .label { font-size:12px; letter-spacing:.08em; opacity:.55; text-transform:uppercase; margin-bottom:7px; }
  .value { font-size:18px; min-height:25px; overflow-wrap:anywhere; }
  .note { opacity:.58; font-size:13px; line-height:1.4; margin-top:20px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div id="clock">--:--:--</div>
    <div id="status">Not listening</div>
  </div>

  <h1>Bilingual speech test</h1>

  <div class="lang">
    <button id="en" class="active">English · en-US</button>
    <button id="th">ไทย · th-TH</button>
  </div>

  <div id="mode">ENGLISH RECOGNITION</div>
  <div id="big">—</div>
  <button id="listen">Listen</button>

  <div class="panel">
    <div class="label">Live / Raw</div>
    <div class="value" id="raw">—</div>
  </div>
  <div class="panel">
    <div class="label">Final transcript</div>
    <div class="value" id="final">—</div>
  </div>

  <div class="note">
    Diagnostic only. Switch languages before speaking. No card-logic changes are included.
  </div>
</div>

<script>
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;
let selectedLang = "en-US";
let listening = false;

const $ = id => document.getElementById(id);

function tick() {
  $("clock").textContent = new Date().toLocaleTimeString([], {
    hour:"2-digit", minute:"2-digit", second:"2-digit"
  });
}
tick(); setInterval(tick, 1000);

function normalizeEnglish(s) {
  return s
    .toLowerCase()
    .replace(/\bspace\b/g, "spades")
    .replace(/\bclap\b/g, "clubs")
    .replace(/\basses\b/g, "aces")
    .replace(/\bass\b/g, "ace")
    .trim();
}

function normalize(s) {
  // For this experiment, Thai mode is deliberately left unpatched.
  // We want to see exactly what Safari gives us.
  return selectedLang === "en-US" ? normalizeEnglish(s) : s.trim();
}

function setLang(lang) {
  selectedLang = lang;
  $("en").classList.toggle("active", lang === "en-US");
  $("th").classList.toggle("active", lang === "th-TH");
  $("mode").textContent = lang === "en-US" ? "ENGLISH RECOGNITION" : "THAI RECOGNITION";
  $("raw").textContent = "—";
  $("final").textContent = "—";
  $("big").textContent = "—";
  if (listening && recognition) recognition.stop();
}

function buildRecognizer() {
  if (!SR) {
    $("status").textContent = "Speech recognition unavailable";
    return null;
  }
  const r = new SR();
  r.lang = selectedLang;
  r.continuous = true;
  r.interimResults = true;
  r.maxAlternatives = 1;

  r.onstart = () => {
    listening = true;
    $("status").textContent = "READY · " + selectedLang;
    $("listen").textContent = "Stop";
  };

  r.onspeechstart = () => {
    $("status").textContent = "Hearing speech · " + selectedLang;
  };

  r.onspeechend = () => {
    $("status").textContent = "READY · " + selectedLang;
  };

  r.onresult = e => {
    let live = "";
    let finals = [];
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const t = e.results[i][0].transcript.trim();
      live += (live ? " " : "") + t;
      if (e.results[i].isFinal) finals.push(t);
    }
    if (live) {
      $("raw").textContent = live;
      $("big").textContent = normalize(live);
    }
    if (finals.length) {
      const f = finals.join(" ");
      $("final").textContent = f;
      $("big").textContent = normalize(f);
    }
  };

  r.onerror = e => {
    $("status").textContent = "Error: " + e.error;
  };

  r.onend = () => {
    listening = false;
    $("listen").textContent = "Listen";
    $("status").textContent = "Not listening";
  };
  return r;
}

function start() {
  recognition = buildRecognizer();
  if (!recognition) return;
  try { recognition.start(); }
  catch(e) { $("status").textContent = "Start failed"; }
}

$("listen").onclick = () => {
  if (listening && recognition) recognition.stop();
  else start();
};

$("en").onclick = () => setLang("en-US");
$("th").onclick = () => setLang("th-TH");
</script>
</body>
</html>
